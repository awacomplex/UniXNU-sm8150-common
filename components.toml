[[component]]
id = "Adreno6xx"
kind = "driver"
function = "Adreno 640 GMU power, SMMU memory and command processor submission"
scope = "gpu"
repository = "https://github.com/RigoLigoRLC/unixnu-adreno6xx.git"
revision = "ecb2b586acfc515699207c0c8cf1832509894a94"
path = "drivers/Adreno6xx"
# 关键差异：SM8150 = Adreno 640（chip id 0x06050000），SM7325 = A642L（0x06030500）。
# GMU/SQE/ZAP 固件不同，需从 SM8150 vendor 分区提取。
hardware = ["Adreno 640", "SM8150"]
os_abi = ["ipados-17.7.11-21H461"]
board_dependencies = ["A6xx GMU, SQE and ZAP firmware", "GPU power resources", "GPU and GMU stream ownership"]
verified_devices = []
dependencies = ["ArmSmmu4K", "AdrenoPM4", "AdrenoFirmware"]
source_files = ["NativeAdrenoService.cpp", "NativeAdrenoA6xxGmu.cpp", "NativeAdrenoA6xxPower.cpp"]
runtime_identifiers = ["NativeAdrenoGpuPublished", "AGXDeviceUserClient"]
build_stage = "embedded"
build = []
outputs = ["build/adreno6xx/libAdreno6xx.a"]
